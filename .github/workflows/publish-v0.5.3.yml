name: Publish v0.5.3 tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-tag:
    name: Publish immutable v0.5.3 tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create v0.5.3
        env:
          TARGET_SHA: 4b01f8a6e8d6cb6fb9bdab56fb521758e6f51cb5
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.5.3 >/dev/null 2>&1; then
            echo "v0.5.3 already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.5.3 "$TARGET_SHA" -m "LeaderAI Cervello + Ecosistema v0.5.3"
          git push origin v0.5.3
